versioning:
  style: uri-path-major
  current: v1
  detail: lifecycle/bokio-lifecycle.yml
error_envelope:
  shape: '{ "error": { "code", "innerCode", "message", "bokioErrorId" } }'
  detail: errors/bokio-problem-types.yml
rate_limit_signaling:
  limit: 200 requests per 60s rolling window per bearer token.
  concurrency: Per-resource concurrency limit on writes.
  headers:
  - Bokio-RateLimit-Limit
  - Bokio-RateLimit-Remaining
  - Bokio-RateLimit-RetryAfter
  exceeded_status: 429
  docs: https://docs.bokio.se/reference/rate-limits
