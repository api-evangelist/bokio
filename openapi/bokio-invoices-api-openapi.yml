components:
  schemas:
    invoice:
      type: object
      title: invoice
      required:
      - invoiceDate
      - lineItems
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        type:
          type: string
          default: invoice
          enum:
          - invoice
          - cashInvoice
          description: The type of the invoice can be invoice or cashInvoice. Can only be set to invoice when creating a new invoice and will default to invoice if not set.
        customerRef:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              readOnly: true
        contactDetailRef:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              nullable: true
            email:
              type: string
              readOnly: true
              nullable: true
            phone:
              type: string
              readOnly: true
              nullable: true
        invoiceNumber:
          type: string
          readOnly: true
          nullable: true
          description: The invoice number will be generated at the time of publishing the invoice.
        paymentReference:
          type: string
          readOnly: true
          nullable: true
          description: The payment reference (OCR number) for the invoice. Populated when the invoice is published, null for drafts.
        orderNumberReference:
          type: string
          nullable: true
          description: The order number associated with the invoice.
        projectReference:
          type: string
          nullable: true
          description: The project reference associated with the invoice.
        buyerReference:
          type: string
          nullable: true
          description: The buyer reference associated with the invoice.
        contractReference:
          type: string
          nullable: true
          description: The contract reference associated with the invoice.
        currency:
          description: ISO 4217 currency code
          type: string
          default: SEK
        currencyRate:
          type: number
          format: double
          default: 1
        totalAmount:
          type: number
          format: double
          readOnly: true
        totalTax:
          type: number
          format: double
          readOnly: true
        paidAmount:
          type: number
          format: double
          readOnly: true
        status:
          type: string
          enum:
          - draft
          - published
          - paid
          - overPaid
          - underPaid
          - overdue
          - credited
          - credit
          default: draft
          readOnly: true
        invoiceDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
          description: 'The due date for the invoice. Optional — when omitted, it is automatically calculated using the fallback chain: customer payment terms → company payment terms → 30 days from the invoice date.'
        publishedDateTime:
          type: string
          format: date-time
          description: The date when the credit note was published (null for draft)
          nullable: true
        lineItems:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/invoiceItem'
        billingAddress:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/addressWithCountrySubdivision'
        deliveryAddress:
          oneOf:
          - $ref: '#/components/schemas/address'
        taxReduction:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/invoiceTaxReduction'
        attachmentRefs:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                readOnly: true
              name:
                type: string
                readOnly: true
        journalEntryRef:
          type: object
          readOnly: true
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
        creditNoteRefs:
          type: array
          readOnly: true
          nullable: true
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                readOnly: true
        metadata:
          type: object
          description: 'Metadata fields for the invoice as string key-value pairs. These fields can be used for filtering.All metadata keys must

            start with a letter or underscore and contain only alphanumeric characters and underscores.

            '
          maxProperties: 10
          additionalProperties:
            type: string
          example:
            project: Website Redesign
            department: IT
            externalId: EXT-INV-2024-001
      example:
        id: a419cf69-db6f-4de9-992c-b1a60942a443
        type: invoice
        customerRef:
          id: 55c899c5-82b2-47fa-9c51-e35fc9b26443
          name: customer 1
        contactDetailRef:
          id: d3b07384-d9a0-4c9b-8b3a-6e1f2a5c8d4e
          email: contact@customer1.com
          phone: '+46701234567'
        invoiceNumber: '1234'
        paymentReference: null
        orderNumberReference: ORD-5678
        projectReference: PROJ-001
        buyerReference: BUYER-123
        contractReference: CONTRACT-456
        currency: SEK
        currencyRate: 1
        totalAmount: 10000
        totalTax: 2500
        paidAmount: 0
        status: draft
        invoiceDate: 2024-10-10
        dueDate: 2024-10-10
        lineItems:
        - id: 1
          itemRef:
            id: 55c899c5-82b2-47fa-9c51-e35fc9b26443
            description: Product 1
          description: Product 1
          itemType: salesItem
          productType: goods
          unitType: piece
          quantity: 1
          unitPrice: 5000
          taxRate: 25
        - id: 2
          description: Installation work
          itemType: salesItem
          productType: services
          unitType: hour
          quantity: 10
          unitPrice: 500
          taxRate: 25
          taxReduction:
            taxReductionType: rot
            jobType: rotConstruction
        - id: 3
          itemRef:
            id: e964435e-50ef-4524-a439-05ff87794952
            description: A description line
          description: A description line
          itemType: descriptionOnlyItem
        billingAddress:
          line1: Älvsborgsvägen 10
          line2: null
          city: Göteborg
          postalCode: 123 45
          country: SE
        deliveryAddress:
          line1: Delivery Street 15
          line2: Floor 2
          city: Stockholm
          postalCode: 111 11
          country: SE
        taxReduction:
          type: rot
          description: Bathroom renovation
          propertyType: realEstate
          realEstateNumber: STOCKHOLM SÖDER 1:2
          deductionAmount: 1500
          status: draft
          deductionPeople:
          - personalNumber: 19850101-1234
            deductionAmount: 1500
        attachmentRefs:
        - id: 240a4af0-edfd-47b1-b4ab-f30450eaac19
          fileName: myfile.pdf
        - id: 94a8f806-8493-40f6-9d5b-0495c84f8ab9
          fileName: myfile2.pdf
        journalEntryRef:
          id: f329df79-eb7f-5ef0-a8dc-c2b71f953554
        metadata:
          project: Website Redesign
          department: IT
          externalId: EXT-INV-2024-001
    apiError:
      type: object
      title: apiError
      properties:
        code:
          type: string
        message:
          type: string
        bokioErrorId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    addressWithCountrySubdivision:
      type: object
      title: addressWithCountrySubdivision
      required:
      - line1
      - city
      - postalCode
      - country
      properties:
        line1:
          type: string
        line2:
          type: string
          nullable: true
        city:
          type: string
        postalCode:
          type: string
        country:
          description: ISO 3166-1 alpha-2 country code
          type: string
          format: country
        countrySubdivision:
          description: ISO 3166-2 subdivision code (e.g. ENG, SCT, WLS, NIR for GB). Currently required for GB (United kingdom) country.
          type: string
          nullable: true
      example:
        line1: 10 Downing Street
        line2: null
        city: London
        postalCode: SW1A 2AA
        country: GB
        countrySubdivision: ENG
    invoiceSettlementRead:
      type: object
      readOnly: true
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the settlement
          readOnly: true
        invoiceId:
          type: string
          format: uuid
          description: The unique identifier of the invoice this settlement belongs to
          readOnly: true
        type:
          type: string
          readOnly: true
          enum:
          - currency
          - bankFee
          - badDebt
          - balanceAdjustment
          - paymentServiceFee
          description: 'The type of the settlement.


            - Currency adjustments are for changes in exchange rates. Currency gain or currency loss is reflected in `sumBaseCurrency` being positive or negative respectively.


            - Bank fees are for charges from banks or payment providers.


            - Bad debts are for uncollectible invoices.


            - Balance adjustments are for correcting discrepancies on invoices without affecting bookkeeping.


            - Payment service fees are for charges from payment service providers (e.g. Stripe). Available for Swedish companies only. Supports different VAT schemes for domestic, EU, non-EU, and VAT-exempt transactions.

            '
        invoiceSettlementDetails:
          oneOf:
          - $ref: '#/components/schemas/standardSettlementDetails'
          - $ref: '#/components/schemas/paymentServiceFeeSettlementDetails'
          discriminator:
            propertyName: reason
            mapping:
              currency: '#/components/schemas/standardSettlementDetails'
              bankFee: '#/components/schemas/standardSettlementDetails'
              badDebt: '#/components/schemas/standardSettlementDetails'
              balanceAdjustment: '#/components/schemas/standardSettlementDetails'
              paymentServiceFee: '#/components/schemas/paymentServiceFeeSettlementDetails'
          description: The settlement details specific to the settlement type
        journalEntryRef:
          type: object
          nullable: true
          readOnly: true
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
      example:
        id: c529df79-eb7f-5ef0-a8dc-c2b71f953554
        invoiceId: a419cf69-db6f-4de9-992c-b1a60942a443
        type: bankFee
        invoiceSettlementDetails:
          date: 2024-10-15
          sumBaseCurrency: 15.5
        journalEntryRef:
          id: 55c899c5-82b2-4a09-899e-9dc03342b5dc
    paymentServiceFeeSettlementDetails:
      type: object
      required:
      - date
      - sumBaseCurrency
      - vatScheme
      properties:
        date:
          type: string
          format: date
          description: The date of the settlement
        sumBaseCurrency:
          type: number
          format: decimal
          description: The settlement amount in base currency. Must be greater than zero.
        vatScheme:
          type: string
          enum:
          - domestic
          - eu
          - nonEu
          - vatExempt
          description: 'The VAT scheme for the payment service fee. Determines how VAT is handled in the bookkeeping.


            - `domestic` — No reverse charge VAT. The fee is booked as a domestic expense.


            - `eu` — EU reverse charge. The fee is booked with reverse charge VAT (output VAT on account 2645, input VAT on account 2614).


            - `nonEu` — Non-EU reverse charge. Same VAT treatment as EU but booked to a different expense account.


            - `vatExempt` — VAT exempt. The fee is booked as a general administrative expense with no VAT.

            '
      example:
        date: 2024-10-15
        sumBaseCurrency: 25
        vatScheme: eu
    pagedResponse:
      type: object
      title: pagedResponse
      properties:
        totalItems:
          type: integer
          format: int32
          example: 1
        totalPages:
          type: integer
          format: int32
          example: 1
        currentPage:
          type: integer
          format: int32
          example: 1
    invoiceSettlementWrite:
      type: object
      required:
      - type
      - invoiceSettlementDetails
      properties:
        type:
          type: string
          enum:
          - currency
          - bankFee
          - paymentServiceFee
          description: 'The type of the settlement.


            - Currency adjustments are for changes in exchange rates. Currency gain or currency loss is reflected in `sumBaseCurrency` being positive or negative respectively.


            - Bank fees are for charges from banks or payment providers.


            - Payment service fees are for charges from payment service providers (e.g. Stripe). Available for Swedish companies only. Requires `vatScheme` in the settlement details.

            '
        invoiceSettlementDetails:
          oneOf:
          - $ref: '#/components/schemas/standardSettlementDetails'
          - $ref: '#/components/schemas/paymentServiceFeeSettlementDetails'
          discriminator:
            propertyName: reason
            mapping:
              currency: '#/components/schemas/standardSettlementDetails'
              bankFee: '#/components/schemas/standardSettlementDetails'
              paymentServiceFee: '#/components/schemas/paymentServiceFeeSettlementDetails'
          description: The settlement details specific to the settlement type
      example:
        type: bankFee
        invoiceSettlementDetails:
          date: 2024-10-15
          sumBaseCurrency: 15.5
    salesInvoiceItem:
