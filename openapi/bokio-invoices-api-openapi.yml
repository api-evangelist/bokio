        itemType: salesItem
        productType: services
        unitType: hour
        quantity: 10
        unitPrice: 500
        taxRate: 25
        bookkeepingAccountNumber: 3389
        taxReduction:
          taxReductionType: rot
          jobType: rotConstruction
    lineItemTaxReduction:
      type: object
      nullable: true
      title: lineItemTaxReduction
      description: 'Tax reduction details for a line item. Only applicable to line items with productType `services` and unitType `hour` or `unspecified`.

        '
      required:
      - taxReductionType
      - jobType
      properties:
        taxReductionType:
          type: string
          enum:
          - rot
          - rut
          description: The tax reduction type for this line item. Must match the invoice-level taxReduction type.
        jobType:
          type: string
          enum:
          - rotConstruction
          - rotElectricity
          - rotGlassPlate
          - rotSoilWork
          - rotSweeping
          - rotPainting
          - rotPlumbing
          - rutChildServices
          - rutDataITServices
          - rutRemovalServices
          - rutClothingCare
          - rutPersonalHelpCare
          - rutRepair
          - rutSnow
          - rutCleaning
          - rutGardening
          - rutWaterWashingOfTextiles
          - rutFurnishing
          - rutTransportOfHouseholdGoods
          - rutHousingSupervision
          description: 'The job type categorizing the work. The prefix must match the tax reduction type:

            - ROT types: rotConstruction, rotElectricity, rotGlassPlate, rotSoilWork, rotSweeping, rotPainting, rotPlumbing

            - RUT types: rutChildServices, rutDataITServices, rutRemovalServices, rutClothingCare, rutPersonalHelpCare, rutRepair, rutSnow, rutCleaning, rutGardening, rutWaterWashingOfTextiles, rutFurnishing, rutTransportOfHouseholdGoods, rutHousingSupervision

            '
      example:
        taxReductionType: rot
        jobType: rotConstruction
    creditNote:
      type: object
      required:
      - id
      - currency
      - creditDate
      - dueDate
      - lineItems
      properties:
        id:
          type: string
          format: uuid
          description: The unique identifier of the credit note
        invoiceRef:
          type: object
          readOnly: true
          properties:
            id:
              type: string
              format: uuid
              description: The unique identifier of the original invoice
            invoiceNumber:
              type: string
              readOnly: true
              description: The invoice number of the original invoice
          description: Reference to the original invoice being credited
        customerRef:
          type: object
          readOnly: true
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
            name:
              type: string
              readOnly: true
        contactDetailRef:
          type: object
          nullable: true
          readOnly: true
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              nullable: true
            email:
              type: string
              readOnly: true
              nullable: true
            phone:
              type: string
              readOnly: true
              nullable: true
        invoiceNumber:
          type: string
          readOnly: true
          nullable: true
          description: The credit note number
        orderNumberReference:
          type: string
          nullable: true
          description: The order number associated with the invoice.
        projectReference:
          type: string
          nullable: true
          description: The project reference associated with the credit note.
        buyerReference:
          type: string
          nullable: true
          description: The buyer reference associated with the credit note.
        contractReference:
          type: string
          nullable: true
          description: The contract reference associated with the credit note.
        currency:
          description: ISO 4217 currency code
          type: string
          default: SEK
        currencyRate:
          type: number
          format: double
          default: 1
        totalAmount:
          type: number
          format: double
          readOnly: true
        totalTax:
          type: number
          format: double
          readOnly: true
        paidAmount:
          type: number
          format: double
          readOnly: true
        status:
          type: string
          enum:
          - draft
          - published
          description: The status of the credit note
          readOnly: true
        creditDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        publishedDateTime:
          type: string
          nullable: true
          format: date-time
          description: The date when the credit note was published (null for draft)
          readOnly: true
        lineItems:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/invoiceItem'
        billingAddress:
          readOnly: true
          oneOf:
          - $ref: '#/components/schemas/addressWithCountrySubdivision'
        deliveryAddress:
          oneOf:
          - $ref: '#/components/schemas/address'
        attachmentRefs:
          type: array
          readOnly: true
          nullable: true
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                readOnly: true
              name:
                type: string
                readOnly: true
        journalEntryRef:
          type: object
          readOnly: true
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
        metadata:
          type: object
          nullable: true
          description: 'Metadata fields for the invoice as string key-value pairs. These fields can be used for filtering.All metadata keys must

            start with a letter or underscore and contain only alphanumeric characters and underscores.

            '
          maxProperties: 10
          additionalProperties:
            type: string
          example:
            project: Website Redesign
            department: IT
            externalId: EXT-INV-2024-001
      example:
        id: b529df79-eb7f-5ef0-a8dc-c2b71f953554
        status: published
        invoiceNumber: CN-2024-001
        invoiceRef:
          id: a419cf69-db6f-4de9-992c-b1a60942a443
          invoiceNumber: IN-2024-001
        customerRef:
          id: 55c899c5-82b2-47fa-9c51-e35fc9b26443
          name: customer 1
        contactDetailRef:
          id: d3b07384-d9a0-4c9b-8b3a-6e1f2a5c8d4e
          email: contact@customer1.com
          phone: '+46701234567'
        currency: SEK
        currencyRate: 1
        totalAmount: 200
        totalTax: 50
        paidAmount: 0
        creditDate: 2024-10-15
        dueDate: 2024-11-15
        publishedDateTime: 2024-10-15 12:00:00
        projectReference: PROJ-001
        buyerReference: BUYER-123
        contractReference: CONTRACT-456
        lineItems:
        - id: 1
          itemRef:
            id: 55c899c5-82b2-47fa-9c51-e35fc9b26443
            description: Product 1
          description: Product 1
          itemType: salesItem
          productType: goods
          quantity: 2
          unitPrice: 100
          taxRate: 25
        billingAddress:
          line1: Älvsborgsvägen 10
          line2: null
          city: Göteborg
          postalCode: 123 45
          country: SE
        deliveryAddress:
          line1: Delivery Street 15
          line2: Floor 2
          city: Stockholm
          postalCode: 111 11
          country: SE
        attachmentRefs:
        - id: 240a4af0-edfd-47b1-b4ab-f30450eaac19
          fileName: myfile.pdf
        - id: 94a8f806-8493-40f6-9d5b-0495c84f8ab9
          fileName: myfile2.pdf
        journalEntryRef:
          id: 340a4af0-edfd-47b1-b4ab-f30450eaac19
        metadata:
          project: Website Redesign
          department: IT
          externalId: EXT-INV-2024-001
    descriptionOnlyInvoiceItem:
