    invoiceTaxReduction:
      type: object
      nullable: true
      title: invoiceTaxReduction
      description: 'Tax reduction details for the invoice.


        **Ownership restriction:** Only the integration that created the invoice can manage tax reduction data. Other integrations can read tax reduction data, but personal numbers will be masked (see `personalNumber`).

        '
      required:
      - type
      - description
      - deductionPeople
      properties:
        type:
          type: string
          enum:
          - rot
          - rut
          description: The tax reduction type.
        description:
          type: string
          description: Description of the tax reduction work performed.
        propertyType:
          type: string
          nullable: true
          enum:
          - realEstate
          - housingDesignation
          description: Required when type is `rot`. The type of property where the work is performed.
        realEstateNumber:
          type: string
          nullable: true
          description: Required when propertyType is `realEstate`. The real estate designation number.
        tenantOrgNumber:
          type: string
          nullable: true
          description: Required when propertyType is `housingDesignation`. The organisational number of the housing association (BRF).
        apartmentNumber:
          type: string
          nullable: true
          description: Required when propertyType is `housingDesignation`. The apartment number within the housing association.
        deductionAmount:
          type: number
          format: double
          readOnly: true
          description: The total deduction amount calculated from all deduction people.
        status:
          type: string
          readOnly: true
          enum:
          - draft
          - awaitingPayment
          - readyToSubmit
          - submitted
          - removed
          - completed
          description: The current status of the tax reduction.
        deductionPeople:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/invoiceTaxReductionDeductionPerson'
          description: The people eligible for the tax deduction. At least one person is required.
      example:
        type: rot
        description: Bathroom renovation
        propertyType: housingDesignation
        tenantOrgNumber: '7164009068'
        apartmentNumber: '1001'
        deductionAmount: 1500
        status: draft
        deductionPeople:
        - personalNumber: 19850101-1234
          deductionAmount: 1500
    invoiceTaxReductionDeductionPerson:
      type: object
      title: invoiceTaxReductionDeductionPerson
      required:
      - personalNumber
      - deductionAmount
      properties:
        personalNumber:
          type: string
          pattern: ^\d{8}-\d{4}$
          description: 'Swedish personal number in format YYYYMMDD-XXXX.


            When the invoice was created by a different integration, the value is fully masked and returned as `YYYYMMDD-XXXX`.

            '
        deductionAmount:
          type: number
          format: double
          minimum: 0
          description: The deduction amount for this person. Must be zero or greater.
      example:
        personalNumber: 19850101-1234
        deductionAmount: 1500
