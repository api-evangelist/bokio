aid: bokio
name: Bokio
description: >-
  Bokio is a Swedish cloud accounting and bookkeeping platform (a Visma company)
  for small businesses, sole traders and their accountants, combining automated
  bookkeeping, invoicing, a business bank account and financial reporting. Its
  public REST API is split into a Company API (journal entries, invoices, credit
  notes, customers, items, suppliers and supplier invoices, uploads, bank
  payments, chart of accounts, fiscal years and SIE export) and a General API
  that handles OAuth 2.0 token issuance and connection management for public
  multi-tenant integrations. Authentication is OAuth 2.0 (authorization code and
  client credentials) with 24 fine-grained resource:action scopes; the API uses
  URI-path versioning (v1), page-number pagination, per-token rate limits and a
  documented deprecation, brownout and sunset lifecycle.
